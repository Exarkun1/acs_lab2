<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>People page</title>
</head>
<body>
<h1>The Book page</h1>
<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Title</th>
        <th>Author</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}" th:style="${book.status == T(org.exarkun.acs_lab2.entities.BookStatus).NOT_AVAILABLE ? 'color: red;' : null }">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.status.value}"></td>
        <td>
            <form th:action="@{/book/{id}/edit(id=${book.id})}" th:method="GET" style="display: inline">
                <input type="submit" value="Edit">
            </form>
            <form th:action="@{/book/{id}/delete(id=${book.id})}" th:method="DELETE" style="display: inline">
                <input type="submit" value="Delete">
            </form>
            <form th:action="@{/book/{id}/get-person(id=${book.id})}" th:method="GET" style="display: inline">
                <input type="submit" value="Person">
            </form>
        </td>
    </tr>
    </tbody>
</table>
<form action="/book/insert" th:method="GET">
    <input type="submit" value="Add book">
</form>
<form action="/hello" th:method="GET">
    <input type="submit" value="Back to menu">
</form>
</body>
</html>
